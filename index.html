<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prima plus A1.2 · Lektion 10: Meine Freizeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--or:#ef7d1a;--or2:#fde6cf;--bg:#fbf7f2;--ink:#2b2b2b;--mut:#6d6a66;--bl:#2f8fd8;--bl2:#d9ecfa;--ok:#2e9d55;--okb:#e2f5e8;--bad:#d64541;--badb:#fbe4e3;--card:#fff;--line:#eadfd3}
*{box-sizing:border-box}
html{font-size:19px}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:var(--or);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header .num{background:#fff;color:var(--or);font-weight:800;font-size:1.5rem;border-radius:10px;padding:2px 12px}
header h1{margin:0;font-size:1.35rem;font-weight:800;flex:1}
header h1 small{display:block;font-weight:600;font-size:.8rem;opacity:.9}
#lockBtn{background:rgba(255,255,255,.2);color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}
nav a{text-decoration:none;color:var(--ink);background:var(--or2);padding:7px 14px;border-radius:999px;font-weight:700;font-size:.9rem;white-space:nowrap}
nav a.on{background:var(--or);color:#fff}
main{max-width:1050px;margin:0 auto;padding:22px}
.sechead h2{margin:0;font-size:1.8rem;color:var(--or)}
.sechead p{margin:2px 0 18px;color:var(--mut);font-weight:600}
.ex{background:var(--card);border-radius:16px;padding:20px 24px;margin:0 0 22px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:6px solid var(--or)}
.ex h3{margin:0 0 2px;font-size:1.2rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ex h3 .n{background:var(--or);color:#fff;border-radius:8px;padding:0 9px;font-size:1rem}
.ex h3 .src{font-size:.75rem;color:var(--mut);font-weight:600;margin-left:auto}
.task{font-weight:700;margin:6px 0 0}
.uk{color:var(--mut);font-size:.9rem;margin:2px 0 0}
.bank{background:var(--bl2);border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:600}
.example{background:#f3f0ec;border-radius:10px;padding:8px 14px;margin:12px 0;font-style:italic;color:#555}
.example::before{content:"Beispiel: ";font-weight:700;font-style:normal}
.card{margin:12px 0}
ol.abc{list-style:none;padding:12px 16px;margin:0;background:#f7f3ee;border-radius:10px}
ol.abc li{margin:4px 0}
.rule{background:var(--bl2);padding:8px 14px;border-radius:10px;font-weight:700;text-align:center}
.form{background:#fffdf5;border:1px dashed #d8c9a8;border-radius:10px;padding:10px 16px}
.form p{margin:6px 0}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notes div{background:#eef7e6;border-radius:10px;padding:10px 14px;font-size:.92rem}
.notes div:nth-child(n+4){background:#fff4dc}
@media(max-width:700px){.notes{grid-template-columns:1fr}}
.items{margin:14px 0 0;padding:0;list-style:none;counter-reset:it}
.items>li{padding:9px 0;border-bottom:1px dashed var(--line);line-height:2.3}
.items.num>li{counter-increment:it;padding-left:2.2em;position:relative}
.items.num>li::before{content:counter(it)".";position:absolute;left:0;font-weight:800;color:var(--or)}
.items>li:last-child{border-bottom:0}
.prose{line-height:2.5;margin-top:12px}
input.gap,select.gap{font:inherit;font-weight:700;color:var(--bl);border:none;border-bottom:2px solid var(--bl);background:#f2f8fd;border-radius:6px 6px 0 0;padding:0 6px;margin:0 2px;min-width:3ch;text-align:center;outline:none}
select.gap{cursor:pointer;padding:2px 4px;text-align:left;max-width:100%}
input.gap:focus,select.gap:focus{background:#e3f0fb}
.ok{color:var(--ok)!important;border-color:var(--ok)!important;background:var(--okb)!important}
.bad{color:var(--bad)!important;border-color:var(--bad)!important;background:var(--badb)!important}
.shown{color:#7a4fc4!important;border-color:#7a4fc4!important;background:#efe8fb!important}
.ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.ch:last-child{border-bottom:0}
.ch .t{flex:1 1 320px}
.ch .bs{display:flex;gap:6px;flex-wrap:wrap}
.ch button{font:inherit;font-size:.9rem;font-weight:700;border:2px solid #cfc6bb;background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer}
.ch button.sel{border-color:var(--bl);background:var(--bl2);color:var(--bl)}
.ch button.sel.ok,.ch button.sel.bad{}
.ch button.right{border-color:#7a4fc4;background:#efe8fb;color:#7a4fc4}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.controls button{font:inherit;font-weight:800;border:none;border-radius:10px;padding:9px 18px;cursor:pointer}
.b-check{background:var(--ok);color:#fff}
.b-reset{background:#ece6df;color:var(--ink)}
.b-show{background:#7a4fc4;color:#fff}
.score{font-weight:800;font-size:1.1rem}
textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-height:3.2em;margin:4px 0 10px}
.model{display:none;background:#efe8fb;border-radius:10px;padding:12px 16px;margin-top:8px}
.model.vis{display:block}
/* syllables */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{font:inherit;font-weight:800;background:var(--bl2);color:var(--bl);border:2px solid var(--bl);border-radius:10px;padding:4px 14px;cursor:pointer}
.chip:disabled{opacity:.25;cursor:default}
.slot{display:flex;align-items:center;gap:10px;margin:8px 0}
.slot .w{min-width:15ch;min-height:2.1em;border-bottom:3px solid var(--bl);background:#f2f8fd;border-radius:8px 8px 0 0;padding:2px 10px;font-weight:800;color:var(--bl);cursor:pointer}
.slot.act .w{outline:3px solid var(--or)}
.bld{padding:8px 0 12px;border-bottom:1px dashed var(--line)}.bld:last-child{border-bottom:0}.bld .chips{margin:6px 0}.bld .bw{flex:1;min-height:2.1em}.bq{font-weight:700}
.mirror{display:inline-block;transform:scaleX(-1);font-family:"Segoe Script","Comic Sans MS",cursive;font-size:1.25rem;background:#fff;border:1px solid #ddd;padding:6px 14px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.slot .bk{font:inherit;border:none;background:#ece6df;border-radius:8px;padding:4px 10px;cursor:pointer}
/* crossword */
.cw{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:8px 16px;align-items:center;margin-top:14px}
.cw .clue{font-size:.92rem}
.cw .cells{display:flex;gap:3px}
.cpad{width:1.9em;flex:none}
.cell{width:1.9em;height:1.9em;text-align:center;font:inherit;font-weight:800;text-transform:uppercase;border:2px solid #cfc6bb;border-radius:6px;padding:0}
.cell.hl{background:var(--bl2);border-color:var(--bl)}
.sol{margin-top:18px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sol .cells span{display:inline-flex;width:1.9em;height:1.9em;align-items:center;justify-content:center;background:var(--bl);color:#fff;border-radius:6px;font-weight:800}
@media(max-width:700px){.cw{grid-template-columns:1fr}}
.pager{display:flex;justify-content:space-between;margin:10px 0 40px}
.pager a{background:var(--or);color:#fff;text-decoration:none;padding:10px 18px;border-radius:12px;font-weight:800}
.pager a.hide{visibility:hidden}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:16px;padding:24px 28px;width:min(92vw,380px);text-align:center}
#modal input{font:inherit;font-size:1.3rem;text-align:center;width:100%;padding:8px;border:2px solid var(--line);border-radius:10px;margin:12px 0;letter-spacing:.15em}
#modal .err{color:var(--bad);font-weight:700;min-height:1.4em}
#modal button{font:inherit;font-weight:800;border:none;border-radius:10px;padding:9px 18px;cursor:pointer;margin:0 4px}
</style>
</head>
<body>

  <span class="num">10</span>
  <h1>Meine Freizeit<small>Prima plus A1.2 · Schülerbuch S. 21–34 · Arbeitsbuch S. 20–31</small></h1>

</div></div>

  if(ex.type==="fill"){
    if(ex.prose)body+=`<div class="prose">${inline(ex.items[0],reg)}</div>`;
    else body+=`<ul class="items${ex.lines?"":" num"}">${ex.items.map(i=>`<li>${inline(i,reg)}</li>`).join("")}</ul>`;
  }else if(ex.type==="choice"){
    body+=`<div>`+ex.items.map((it,i)=>{const id="g"+(gid++);reg.push({k:"ch",id,ans:it[1]});
      return `<div class="ch" id="${id}"><div class="t">${it[0]}</div><div class="bs">${ex.options.map((o,j)=>`<button data-v="${j}">${o}</button>`).join("")}</div></div>`}).join("")+`</div>`;
  }else if(ex.type==="open"){
    body+=ex.prompts.map(p=>`<div style="font-weight:700">${p}</div><textarea></textarea>`).join("");
    const id="g"+(gid++);reg.push({k:"open",id});body+=`<div class="model" id="${id}">${ex.model}</div>`;
  }else if(ex.type==="syll"){
    body+=`<div class="chips">${ex.syllables.map((s,i)=>`<button class="chip" data-i="${i}">${s}</button>`).join("")}</div>`;
    body+=ex.slots.map((s,i)=>{const id="g"+(gid++);reg.push({k:"syll",id,ans:[s[1]],parts:[]});
      return `<div class="slot${i===0?" act":""}" id="${id}"><div class="w"></div><span>${s[0]}</span><button class="bk" title="видалити">⌫</button></div>`}).join("");
  }else if(ex.type==="build"){
    body+=`<div>`+ex.items.map((it,i)=>{const id="g"+(gid++);reg.push({k:"build",id,ans:it.a,words:it.w,parts:[]});
      return `<div class="bld" id="${id}"><div class="bq">${it.q||""}</div><div class="chips">${it.w.map((w,j)=>`<button class="chip" data-i="${j}">${w}</button>`).join("")}</div><div class="slot"><div class="w bw"></div><button class="bk" title="видалити">⌫</button></div></div>`}).join("")+`</div>`;
  }else if(ex.type==="cross"){
    const mx=ex.align?Math.max(...ex.rows.map(r=>r[2])):0;
    body+=`<div class="cw">`+ex.rows.map((r,i)=>{const id="g"+(gid++);reg.push({k:"word",id,ans:r[1]});
      const pad=ex.align?"<span class='cpad'></span>".repeat(mx-r[2]):"";
      return `<div class="clue"><b>${i+1}.</b> ${r[0]}</div><div class="cells" id="${id}">${pad}${[...r[1]].map((c,j)=>`<input class="cell${j===r[2]-1?" hl":""}" maxlength="1">`).join("")}</div>`}).join("")+`</div>`;
    body+=`<div class="sol"><span>Lösungswort: ${ex.solpre}</span><span class="cells">${[...ex.solution].map(()=>"<span>&nbsp;</span>").join("")}</span><span>${ex.solpost}</span></div>`;
  }
  const hasCheck=ex.type!=="open";
  el.innerHTML=`<h3><span class="n">${n}</span>${ex.title}<span class="src">${ex.src||""}</span></h3>
   <p class="task">${ex.task}</p>${ex.uk?`<p class="uk">${ex.uk}</p>`:""}${body}
   <div class="controls">${hasCheck?`<button class="b-check">✔ Перевірити</button>`:""}<button class="b-reset">↺ Очистити</button><button class="b-show">🔑 ${hasCheck?"Показати відповіді":"Показати зразок"}</button><span class="score"></span></div>`;
  reg.forEach(r=>r.el=el.querySelector("#"+r.id));
  wire(ex,el,reg);
  return el;
}

function wire(ex,el,reg){
  const score=$(".score",el);
  const clear=e=>e.classList.remove("ok","bad","shown");
  el.addEventListener("input",e=>{clear(e.target);score.textContent=""});
  el.addEventListener("change",e=>{clear(e.target);score.textContent=""});
  if(ex.type==="choice"){
    reg.forEach(r=>{r.val=null;r.el.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      r.val=+b.dataset.v;r.el.querySelectorAll("button").forEach(x=>{x.classList.remove("sel","ok","bad","right")});b.classList.add("sel");score.textContent="";});});
  }
  if(ex.type==="syll"){
    let act=reg[0];
    const chips=[...el.querySelectorAll(".chip")];
    const draw=r=>{r.el.querySelector(".w").textContent=r.parts.map(i=>ex.syllables[i]).join("").replace(/^(.)/,c=>c.toUpperCase());clear(r.el.querySelector(".w"));score.textContent=""};
    reg.forEach(r=>{
      r.el.querySelector(".w").onclick=()=>{act=r;reg.forEach(x=>x.el.classList.toggle("act",x===r))};
      r.el.querySelector(".bk").onclick=()=>{const i=r.parts.pop();if(i!=null)chips[i].disabled=false;draw(r)};
      r.draw=draw;
    });
    chips.forEach(c=>c.onclick=()=>{if(!act||act.locked)return;act.parts.push(+c.dataset.i);c.disabled=true;draw(act)});
    ex._chips=chips;
  }
  if(ex.type==="build"){
    reg.forEach(r=>{
      const chips=[...r.el.querySelectorAll(".chip")],w=r.el.querySelector(".bw");
      r.draw=()=>{let t=r.parts.map(i=>r.words[i]).join(" ");w.textContent=t?t.charAt(0).toUpperCase()+t.slice(1)+(ex.end||""):"";clear(w);score.textContent="";chips.forEach((c,i)=>c.disabled=r.locked||r.parts.includes(i))};
      chips.forEach((c,i)=>c.onclick=()=>{if(r.locked)return;r.parts.push(i);r.draw()});
      r.el.querySelector(".bk").onclick=()=>{if(r.locked)return;r.parts.pop();r.draw()};
    });
  }
  if(ex.type==="cross"){
    const solCells=[...el.querySelectorAll(".sol .cells span")];
    const upd=()=>{reg.forEach((r,i)=>{const c=r.el.querySelector(".hl");solCells[i].textContent=c&&c.value?c.value.toUpperCase():" "})};
    el.querySelectorAll(".cell").forEach(c=>{
      c.addEventListener("input",()=>{if(c.value){const nx=c.nextElementSibling;if(nx&&nx.tagName==='INPUT')nx.focus();}upd();});
      c.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!c.value){const pv=c.previousElementSibling;if(pv&&pv.tagName==='INPUT'){pv.focus();pv.value="";upd();e.preventDefault();}}});
    });
    ex._upd=upd;
  }
  const check=()=>{
    let ok=0,tot=0;
    reg.forEach(r=>{
      if(r.k==="open")return;tot++;let good=false;
      if(r.k==="in"||r.k==="sel"){good=r.ans.some(a=>norm(a)===norm(r.el.value));r.el.classList.remove("shown");r.el.classList.toggle("ok",good);r.el.classList.toggle("bad",!good);}
      else if(r.k==="ch"){good=[].concat(r.ans).includes(r.val);const b=r.el.querySelector(".sel");if(b){b.classList.toggle("ok",good);b.classList.toggle("bad",!good)}}
      else if(r.k==="syll"){const w=r.el.querySelector(".w");good=norm(w.textContent)===norm(r.ans[0]);w.classList.toggle("ok",good);w.classList.toggle("bad",!good);}
      else if(r.k==="build"){const w=r.el.querySelector(".bw");good=r.locked||r.ans.some(a=>norm(a)===norm(r.parts.map(i=>r.words[i]).join(" ")));w.classList.toggle("ok",good);w.classList.toggle("bad",!good);}
      else if(r.k==="word"){const v=[...r.el.querySelectorAll("input")].map(i=>i.value).join("");good=norm(v)===norm(r.ans);r.el.querySelectorAll("input").forEach(i=>{i.classList.toggle("ok",good);i.classList.toggle("bad",!good)});}
      if(good)ok++;
    });
    score.textContent=`${ok===tot?"🎉":"✔"} ${ok} / ${tot}`;score.style.color=ok===tot?"var(--ok)":"var(--ink)";
  };
  const show=()=>{
    reg.forEach(r=>{
      if(r.k==="in"||r.k==="sel"){r.el.value=r.ans[0];r.el.classList.remove("ok","bad");r.el.classList.add("shown");}
      else if(r.k==="ch"){r.val=[].concat(r.ans)[0];r.el.querySelectorAll("button").forEach((b,j)=>{b.classList.remove("ok","bad","sel");b.classList.toggle("right",[].concat(r.ans).includes(j));if(j===[].concat(r.ans)[0])b.classList.add("sel")})}
      else if(r.k==="open"){r.el.classList.add("vis")}
      else if(r.k==="syll"){const w=r.el.querySelector(".w");w.textContent=r.ans[0];w.classList.remove("ok","bad");w.classList.add("shown");r.locked=true;}
      else if(r.k==="build"){r.locked=true;r.draw();const w=r.el.querySelector(".bw");w.textContent=r.ans[0]+(ex.end||r.end||"");w.classList.add("shown")}
      else if(r.k==="word"){r.el.querySelectorAll("input").forEach((i,j)=>{i.value=r.ans[j];i.classList.remove("ok","bad");i.classList.add("shown")})}
    });
    if(ex._chips)ex._chips.forEach(c=>c.disabled=true);
    if(ex._upd)ex._upd();score.textContent="";
  };
  const reset=()=>{
    reg.forEach(r=>{
      if(r.k==="in"||r.k==="sel"){r.el.value="";clear(r.el)}
      else if(r.k==="ch"){r.val=null;r.el.querySelectorAll("button").forEach(b=>b.classList.remove("sel","ok","bad","right"))}
      else if(r.k==="open"){r.el.classList.remove("vis");el.querySelectorAll("textarea").forEach(t=>t.value="")}
      else if(r.k==="syll"){r.parts=[];r.locked=false;r.draw(r)}
      else if(r.k==="build"){r.parts=[];r.locked=false;r.draw()}
      else if(r.k==="word"){r.el.querySelectorAll("input").forEach(i=>{i.value="";clear(i)})}
    });
    if(ex._chips)ex._chips.forEach(c=>c.disabled=false);
    if(ex._upd)ex._upd();score.textContent="";
  };
  const bc=$(".b-check",el);if(bc)bc.onclick=check;
  $(".b-reset",el).onclick=reset;
  $(".b-show",el).onclick=()=>withPw(show);
}

/* password */
let pending=null;
const modal=$("#modal"),pw=$("#pw"),pwErr=$("#pwErr");
function setLock(){$("#lockBtn").textContent=unlocked?"🔓 Учитель":"🔒 Учень";try{sessionStorage.setItem("pa12u",unlocked?"1":"0")}catch(e){}}
function withPw(fn){if(unlocked){fn();return}pending=fn;pw.value="";pwErr.textContent="";modal.classList.add("open");setTimeout(()=>pw.focus(),50)}
function tryPw(){if(cyrb53(pw.value.trim())===PWH){unlocked=true;setLock();modal.classList.remove("open");if(pending)pending();pending=null}else{pwErr.textContent="Неправильний пароль";pw.select()}}
$("#pwOk").onclick=tryPw;pw.addEventListener("keydown",e=>{if(e.key==="Enter")tryPw();if(e.key==="Escape")modal.classList.remove("open")});
$("#pwCancel").onclick=()=>{modal.classList.remove("open");pending=null};
$("#lockBtn").onclick=()=>{if(unlocked){unlocked=false;setLock()}else withPw(()=>{})};
setLock();

/* sections & routing */
const nav=$("#nav"),main=$("#main");
nav.innerHTML=DATA.map(s=>`<a href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title}</a>`).join("");
const built={};
function route(){
  let id=(location.hash||"").slice(1);if(!DATA.find(s=>s.id===id))id=DATA[0].id;
  const idx=DATA.findIndex(s=>s.id===id),s=DATA[idx];
  nav.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.dataset.id===id));
  if(!built[id]){
    const wrap=document.createElement("div");
    wrap.innerHTML=`<div class="sechead"><h2>${s.icon} ${s.title}</h2><p>${s.sub}</p></div>`;
    s.ex.forEach((ex,i)=>wrap.appendChild(buildEx(ex,`${idx+1}.${i+1}`)));
    const pg=document.createElement("div");pg.className="pager";
    const pv=DATA[idx-1],nx=DATA[idx+1];
    pg.innerHTML=`<a href="#${pv?pv.id:""}" class="${pv?"":"hide"}">← ${pv?pv.title:""}</a><a href="#${nx?nx.id:""}" class="${nx?"":"hide"}">${nx?nx.title:""} →</a>`;
    wrap.appendChild(pg);built[id]=wrap;
  }
  main.replaceChildren(built[id]);window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script>
